# BossCoding 质检口（由 BossCoding 管理：`npx boss update` 会刷新本文件，自定义步骤请放独立的 workflow 文件）
name: bosscoding

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# 只读代码，不写任何 GitHub 资源。
permissions:
  contents: read

jobs:
  check:
    # Draft（草稿）PR 不占质检额度；转 Ready 才跑，工位名换成 draft-skip 以免遮住必过检查。
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip' || 'check' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: 守卫
        run: npx boss check
      - name: 代码检查（项目配置了才跑）
        run: npm run lint --if-present
      - name: 测试（项目配置了才跑）
        run: npm test --if-present
