# 框架自身的质检口：单测＋用自己的守卫检查自己（吃自己的狗粮）。
# 零依赖，所以没有安装步骤——这也是对「运行时零第三方依赖」不变量的持续验证：
# 一旦有人引入依赖，这里会当场红。
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip' || 'check' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 单测
        run: node --test
      - name: 守卫（自检）
        run: node bin/bosscoding.mjs check
